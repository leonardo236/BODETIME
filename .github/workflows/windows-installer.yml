name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Run tests
        run: python -m pytest -q
      - name: Package application
        run: >-
          pyinstaller --noconfirm --clean --windowed --onedir
          --name BODETIME --add-data "schema.sql;." main.py
      - name: Install Inno Setup from the official release
        shell: powershell
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.4.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe' -OutFile $installer
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid') { throw "Firma de Inno Setup no válida: $($signature.Status)" }
          $process = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/DIR=C:\Program Files (x86)\Inno Setup 6' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup terminó con código $($process.ExitCode)" }
      - name: Build installer
        shell: powershell
        run: |
          $version = if ($env:GITHUB_REF_NAME -match '^v(\d+\.\d+\.\d+)$') { $Matches[1] } else { '1.0.6' }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\BODETIME.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC terminó con código $LASTEXITCODE" }
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BODETIME-Windows-Installer
          path: output/BODETIME-Setup.exe
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output/BODETIME-Setup.exe
          body_path: .github/release-notes/latest.md
          name: BODETIME ${{ github.ref_name }}
