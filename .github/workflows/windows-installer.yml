name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Run tests
        run: python -m pytest -q
      - name: Package application
        run: >-
          pyinstaller --noconfirm --clean --windowed --onedir
          --name BODETIME --add-data "schema.sql;." main.py
      - name: Install Inno Setup
        run: choco install innosetup --version=6.7.4 --yes --no-progress
      - name: Build installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\BODETIME.iss'
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BODETIME-Windows-Installer
          path: output/BODETIME-Setup.exe
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output/BODETIME-Setup.exe
